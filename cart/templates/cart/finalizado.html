<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Projeto concluído | Minha Loja</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .cartao {
            max-width: 650px;
            width: 100%;
            background: white;
            padding: 50px 30px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 15px 50px #0f172a12;
        }

        .icone {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: #dcfce7;
            color: #15803d;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            margin: 0 auto 25px;
        }

        .btn-loja {
            background: #4f46e5;
            color: white;
            padding: 12px 24px;
        }

        .btn-loja:hover {      
            background: #4338ca;
            color: white;
        }
    </style>
</head>

<body>
    <main class="cartao">
        <div class="icone">✓</div>

        <h1 class="fw-bold mb-3">Você chegou ao final!</h1>

        <p class="text-secondary fs-5">
            Obrigado por conhecer nossa loja.
        </p>

        <p class="text-secondary mb-4">
            Esta demonstração apresentou a seleção de produtos,
            o carrinho de compras e a etapa de finalização.
            A partir daqui, o projeto acadêmico se encerra.
            Nenhum pedido real foi registrado e nenhum pagamento foi realizado.
        </p>

        <a href="{% url 'home' %}" class="btn btn-loja">
            Voltar para a loja
        </a>
    </main>
</body>
</html>
