<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar | Minha Loja</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <main class="container py-5" style="max-width: 500px;">
        <div class="card border-0 shadow-sm rounded-4">
            <div class="card-body p-4 p-md-5">
                <h1 class="fw-bold mb-2">Bem-vindo de volta!</h1>
                <p class="text-secondary mb-4">Entre na sua conta para continuar.</p>

                <form method="post">
                    {% csrf_token %}

                    {% if form.errors %}
                        <div class="alert alert-danger">
                            E-mail ou senha incorretos.
                        </div>
                    {% endif %}

                    <div class="mb-3">
                        <label class="form-label" for="{{ form.username.id_for_label }}">
                            E-mail
                        </label>
                        <input
                            type="email"
                            name="username"
                            id="{{ form.username.id_for_label }}"
                            class="form-control"
                            autocomplete="email"
                            required
                        >
                    </div>

                    <div class="mb-4">
                        <label class="form-label" for="{{ form.password.id_for_label }}">
                            Senha
                        </label>
                        <input
                            type="password"
                            name="password"
                            id="{{ form.password.id_for_label }}"
                            class="form-control"
                            autocomplete="current-password"
                            required
                        >
                    </div>

                    <button class="btn btn-primary w-100 py-2" type="submit">
                        Entrar
                    </button>
                </form>

                <p class="text-center mt-4 mb-0">
                    Ainda não tem conta?
                    <a href="{% url 'cadastro' %}">Cadastre-se</a>
                </p>
            </div>
        </div>
    </main>
</body>
</html>
