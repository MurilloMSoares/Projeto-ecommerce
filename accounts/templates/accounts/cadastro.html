<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Criar conta | Minha Loja</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <main class="container py-5" style="max-width: 600px;">
        <div class="card border-0 shadow-sm rounded-4">
            <div class="card-body p-4 p-md-5">
                <h1 class="fw-bold mb-2">Criar sua conta</h1>
                <p class="text-secondary mb-4">Preencha seus dados para começar.</p>

                <form method="post">
                    {% csrf_token %}

                    {% if form.non_field_errors %}
                        <div class="alert alert-danger">
                            {{ form.non_field_errors }}
                        </div>
                    {% endif %}

                    {% for campo in form %}
                        <div class="mb-3">
                            <label class="form-label" for="{{ campo.id_for_label }}">
                                {{ campo.label }}
                            </label>
                            {{ campo }}
                            {% for erro in campo.errors %}
                                <div class="text-danger small">{{ erro }}</div>
                            {% endfor %}
                        </div>
                    {% endfor %}

                    <button class="btn btn-primary w-100 py-2" type="submit">
                        Criar conta
                    </button>
                </form>

                <p class="text-center mt-4 mb-0">
                    Já tem conta?
                    <a href="{% url 'login' %}">Entrar</a>
                </p>
            </div>
        </div>
    </main>

    <script>
        document.querySelectorAll('input').forEach(function(campo) {
            campo.classList.add('form-control');
        });
    </script>
</body>
</html>
